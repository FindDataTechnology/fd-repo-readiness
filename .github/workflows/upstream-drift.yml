name: upstream-drift

# Scheduled, not per-push: CI has no access to the private source repo these files are
# adapted from. A push-time run would report "cannot judge" on every commit, and a gate
# that is permanently unable to judge trains people to ignore it. This one runs where the
# source is checked out alongside.

on:
  schedule:
    - cron: "17 3 * * 1"        # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check_upstream self-test
        # Both drift directions and the cannot-judge case, on synthetic repos.
        run: python3 check_upstream.py --self-test

  drift:
    needs: self-test
    runs-on: [self-hosted, linux]     # needs a checkout of the source repo; see README
    steps:
      - uses: actions/checkout@v4
      - name: check for upstream drift
        run: python3 check_upstream.py --source "${FD_SOURCE_REPO:?set FD_SOURCE_REPO on the runner}"
